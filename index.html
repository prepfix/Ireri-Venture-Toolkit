<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b1f24;--mu:#5f6872;--ac:#0f6b4f;--ln:#6f7882;--sf:#dfe3e8;--hd:#e0f0e8;--hdt:#0b4a37;--mhb:#0f6b4f;--rd:#c0392b;--gn:#1e8e5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1e2327;--tx:#e8ebee;--mu:#98a2ad;--ac:#3cc08f;--ln:#7a8691;--sf:#2d343a;--rd:#ef7766;--gn:#4cc98c;--hd:#1d3a2f;--hdt:#8fe6bf;--mhb:#1f7a5a}}
:root[data-theme="dark"]{--hd:#1d3a2f;--hdt:#8fe6bf;--mhb:#1f7a5a;--bg:#14171a;--card:#1e2327;--tx:#e8ebee;--mu:#98a2ad;--ac:#3cc08f;--ln:#7a8691;--sf:#2d343a;--rd:#ef7766;--gn:#4cc98c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Arial,Helvetica,sans-serif;padding-bottom:72px}
header{background:var(--ac);color:#fff;text-align:center;padding:12px 10px;border-bottom:3px solid var(--tx)}
header h1{margin:0;font-size:24px;letter-spacing:3px}.lg{height:44px;border-radius:6px;border:2px solid #fff;display:block;margin:0 auto 6px;background:#fff}header small{color:#fff;opacity:.9}
.mu{color:var(--mu)}small{color:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:2px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-right:1px solid var(--sf);background:none;color:var(--mu);padding:12px 2px;font-size:13px}nav button:last-child{border-right:0}nav button.on{color:var(--ac);font-weight:700}
main{padding:8px 12px;max-width:820px;margin:auto}
.c{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;margin:8px 0}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:6px;overflow:hidden;margin:8px 0}.g .c{margin:0;text-align:center;border:0;border-radius:0}.g b{display:block;font-size:15px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:6px;background:var(--card);color:var(--tx);font:inherit;margin:3px 0}
label{display:block;font-size:12px;color:var(--mu);margin-top:6px}
.r{display:flex;gap:8px}.r>*{flex:1}
button.b{background:var(--ac);color:#fff;border:1px solid var(--ac);border-radius:6px;padding:10px 14px;font:inherit;font-weight:700}
button.s{background:none;border:1px solid var(--ln);color:var(--tx);border-radius:6px;padding:7px 10px;font:inherit;font-size:13px}
.row{display:flex;justify-content:space-between;gap:8px}.row b{overflow-wrap:anywhere}
.t{font-size:12px;padding:2px 7px;border-radius:9px;border:1px solid var(--ln);white-space:nowrap}.red{color:var(--rd)}.grn{color:var(--gn)}
.bar{height:8px;background:var(--ac);border-radius:4px;margin-top:3px}
.gc{display:grid;grid-template-columns:1fr auto;gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:6px;overflow:hidden;margin:8px 0}
.gc>*{background:var(--card);padding:6px 10px;margin:0}.gc .w,.fg .w{grid-column:1/-1}.gc .rt{text-align:right}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:6px;overflow:hidden;margin:8px 0}
.fg>div{background:var(--card);padding:2px 10px 6px}.fg input,.fg select,.fg textarea{border:0;border-bottom:1px solid var(--sf);border-radius:0;margin:0;padding:8px 2px}
.btn{display:block;text-align:center;margin:0;padding:10px 4px;color:var(--tx);font-size:13px;cursor:pointer}.th{width:84px;height:84px;object-fit:cover;border:1px solid var(--ln);border-radius:4px;display:block;background:var(--sf)}
.seg{display:flex;border:1px solid var(--ln);border-radius:6px;overflow:hidden;margin:8px 0}.seg button{flex:1;border:0;border-right:1px solid var(--ln);background:var(--card);color:var(--mu);padding:10px 2px;font-size:12px;white-space:nowrap}.seg button:last-child{border-right:0}.seg button.on{background:var(--ac);color:#fff;font-weight:700}.fg b{display:block;font-size:15px}
h2{font-size:15px;margin:16px 0 6px;padding:7px 10px;background:var(--hd);color:var(--hdt);border-left:5px solid var(--mhb);border-radius:6px}
h2.mh{display:flex;justify-content:space-between;gap:8px;background:var(--mhb);color:#fff;border-left:0;font-size:14px}.pl{border:1px solid var(--sf);border-radius:6px;padding:6px 8px;margin:5px 0;font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:6px;margin:8px 0}
table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--ln);padding:5px 7px;font-size:12px;white-space:nowrap;text-align:left}
th{background:var(--sf)}td.n{text-align:right}tfoot td{font-weight:700;background:var(--sf)}
textarea{min-height:150px;resize:vertical}
.dh{display:flex;justify-content:space-between;gap:8px;background:var(--sf);padding:6px 10px;border-radius:6px;margin:10px 0 4px;font-weight:700;font-size:13px}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block!important}#pr,#pr *{color:#000!important;background:#fff!important}#pr th{background:#ddd!important}#pr td,#pr th{white-space:normal;font-size:10px}}
