<style>
:root{--bg:#f6f2fc;--card:#fff;--tx:#1b1330;--mu:#665b80;--ac:#5f1fae;--acx:#5f1fae;--ln:#9a8cb8;--sf:#ebe4f6;--hd:#efe6fb;--hdt:#3b0f73;--mhb:#3b0f73;--rd:#c0392b;--gn:#12805a;--gd:#f2b600;--gd2:#ffd34d;--nv:#0b2a6f;--cy:#1fa7e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#130b22;--card:#1f1433;--tx:#f1ebfa;--mu:#a999c6;--ac:#7c3aed;--acx:#c9a4ff;--ln:#5d4b80;--sf:#2c1f48;--rd:#ff8a7a;--gn:#4cd196;--hd:#2a1850;--hdt:#e6d0ff;--mhb:#4a1d8f}}
:root[data-theme="dark"]{--bg:#130b22;--card:#1f1433;--tx:#f1ebfa;--mu:#a999c6;--ac:#7c3aed;--acx:#c9a4ff;--ln:#5d4b80;--sf:#2c1f48;--rd:#ff8a7a;--gn:#4cd196;--hd:#2a1850;--hdt:#e6d0ff;--mhb:#4a1d8f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Arial,Helvetica,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
header{overflow:hidden;display:flex;align-items:center;gap:12px;padding:10px 14px;color:#fff;background:linear-gradient(135deg,#2a0a52 0%,#5f1fae 65%,#7a2bd0 100%);border-bottom:3px solid var(--gd)}
header .ht{min-width:0}header h1{margin:0;font-size:21px;letter-spacing:2px;color:#fff;line-height:1.15}header small{display:block;color:var(--gd2);font-weight:600;font-size:12px;margin-top:2px}
.lg{width:54px;height:54px;flex:0 0 54px;border-radius:50%;object-fit:contain;animation:gl 2.6s ease-in-out infinite}
@keyframes gl{0%,100%{filter:drop-shadow(0 0 3px rgba(255,211,77,.65)) drop-shadow(0 0 9px rgba(168,85,247,.55))}50%{filter:drop-shadow(0 0 7px rgba(255,211,77,1)) drop-shadow(0 0 18px rgba(34,211,238,.75))}}
#sp{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 38%,#6a24bd 0%,#2a0a52 55%,#12051f 100%);color:#fff;text-align:center;animation:spo .5s ease 1.9s forwards}
#sp img{width:min(64vw,270px);height:auto;animation:spi .9s ease both,gl 2.4s ease-in-out .9s infinite}
#sp .t1{margin-top:16px;font-size:22px;font-weight:800;letter-spacing:4px}#sp .t2{margin-top:2px;color:var(--gd2);font-weight:700;letter-spacing:9px;font-size:15px}
#sp .t3{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));color:var(--gd2);font-size:11px;font-weight:700;letter-spacing:1px}
@keyframes spi{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}@keyframes spo{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){.lg,#sp img{animation:none;filter:drop-shadow(0 0 6px rgba(255,211,77,.9))}#sp{animation-delay:1s}}
footer{margin-top:16px;padding:12px 10px;text-align:center;background:linear-gradient(135deg,#2a0a52,#5f1fae);color:var(--gd2);font-size:12px;font-weight:700;letter-spacing:1px;border-top:3px solid var(--gd)}footer a{color:#fff;text-decoration:none}
.mu{color:var(--mu)}small{color:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:3px solid var(--gd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-right:1px solid var(--sf);background:none;color:var(--mu);padding:12px 2px;font-size:13px}nav button:last-child{border-right:0}nav button.on{color:var(--acx);font-weight:700;background:var(--hd)}
main{padding:8px 12px;max-width:820px;margin:auto}
.c{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;margin:8px 0}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:6px;overflow:hidden;margin:8px 0}.g .c{margin:0;text-align:center;border:0;border-radius:0}.g b{display:block;font-size:15px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:6px;background:var(--card);color:var(--tx);font:inherit;margin:3px 0}
label{display:block;font-size:12px;color:var(--mu);margin-top:6px}
.r{display:flex;gap:8px}.r>*{flex:1}
button.b{background:var(--ac);color:#fff;border:1px solid var(--ac);box-shadow:0 2px 0 var(--gd);border-radius:6px;padding:10px 14px;font:inherit;font-weight:700}
button.s{background:none;border:1px solid var(--ln);color:var(--tx);border-radius:6px;padding:7px 10px;font:inherit;font-size:13px}
.row{display:flex;justify-content:space-between;gap:8px}.row b{overflow-wrap:anywhere}
.t{font-size:12px;padding:2px 7px;border-radius:9px;border:1px solid var(--ln);white-space:nowrap}.red{color:var(--rd)}.grn{color:var(--gn)}
.bar{height:8px;background:linear-gradient(90deg,var(--ac),var(--cy));border-radius:4px;margin-top:3px}
.gc{display:grid;grid-template-columns:1fr auto;gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:6px;overflow:hidden;margin:8px 0}
.gc>*{background:var(--card);padding:6px 10px;margin:0}.gc .w,.fg .w{grid-column:1/-1}.gc .rt{text-align:right}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:6px;overflow:hidden;margin:8px 0}
.fg>div{background:var(--card);padding:2px 10px 6px}.fg input,.fg select,.fg textarea{border:0;border-bottom:1px solid var(--sf);border-radius:0;margin:0;padding:8px 2px}
.btn{display:block;text-align:center;margin:0;padding:10px 4px;color:var(--tx);font-size:13px;cursor:pointer}.th{width:84px;height:84px;object-fit:cover;border:1px solid var(--ln);border-radius:4px;display:block;background:var(--sf)}
.seg{display:flex;border:1px solid var(--ln);border-radius:6px;overflow:hidden;margin:8px 0}.seg button{flex:1;border:0;border-right:1px solid var(--ln);background:var(--card);color:var(--mu);padding:10px 2px;font-size:12px;white-space:nowrap}.seg button:last-child{border-right:0}.seg button.on{background:var(--ac);color:#fff;font-weight:700}.fg b{display:block;font-size:15px}
h2{font-size:15px;margin:16px 0 6px;padding:7px 10px;background:var(--hd);color:var(--hdt);border-left:5px solid var(--gd);border-radius:6px}
h2.mh{display:flex;justify-content:space-between;gap:8px;background:var(--mhb);color:#fff;font-size:14px}.pl{border:1px solid var(--sf);border-radius:6px;padding:6px 8px;margin:5px 0;font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:6px;margin:8px 0}
table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--ln);padding:5px 7px;font-size:12px;white-space:nowrap;text-align:left}
th{background:var(--sf)}td.n{text-align:right}tfoot td{font-weight:700;background:var(--sf)}
textarea{min-height:150px;resize:vertical}
.dh{border-left:4px solid var(--gd);display:flex;justify-content:space-between;gap:8px;background:var(--sf);padding:6px 10px;border-radius:6px;margin:10px 0 4px;font-weight:700;font-size:13px}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block!important}#pr,#pr *{color:#000!important;background:#fff!important}#pr th{background:#ddd!important}#pr td,#pr th{white-space:normal;font-size:10px}}

/* fixed footer + nav, highlighted total, foldable headers */
body{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
footer{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:60;height:calc(30px + env(safe-area-inset-bottom,0px));padding:7px 8px 0;white-space:nowrap;overflow:hidden;font-size:11.5px}
nav{bottom:calc(30px + env(safe-area-inset-bottom,0px));padding-bottom:0;z-index:60}
.tot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0;padding:10px 14px;border-radius:8px;border:2px solid var(--gd);background:linear-gradient(135deg,#fff3c4,#ffd34d);color:#2a0a52;box-shadow:0 2px 0 var(--gd)}
.tot span{font-size:14px;font-weight:800}.tot b{font-size:21px;font-weight:900;letter-spacing:.3px}
h2.yh,h2.mh{display:flex;justify-content:space-between;gap:8px;cursor:pointer;user-select:none;-webkit-user-select:none}
h2.yh{background:var(--nv);color:#fff;font-size:16px;border-left-color:var(--gd2)}
h2.mh{margin-left:10px}
.ms{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:-2px 4px 6px 16px}
h2.yh:focus-visible,h2.mh:focus-visible{outline:3px solid var(--gd2);outline-offset:2px}
.sn{display:inline-block;min-width:2.1em;color:var(--acx)}
